name: Profitero
description: >-
  Profitero+ is an eCommerce data, technology and services platform that helps consumer
  brands measure and grow their digital shelf presence across major retailers including
  Amazon, Walmart, Tesco and Target. It combines digital shelf analytics, Amazon sales and
  share measurement, content optimisation, retail media activation (Shelf Intelligent Media)
  and managed services, monitoring more than 1,400 retailer sites in 70+ countries for over
  9,000 global brands. Founded in Dublin in 2010 and acquired by Publicis Groupe in March
  2022, it now operates inside Publicis Commerce. Profitero was surfaced as a portfolio
  company of Seedcamp and added to the API Evangelist network. A partner API does exist —
  Profitero's own CEO wrote in 2020 that technology partners such as Kenshoo and Pacvue
  "integrate directly with Profitero via API" — but the company publishes no developer
  portal, API reference, OpenAPI or AsyncAPI definition, GraphQL endpoint, Postman
  collection, MCP server, agent card or SDK on any public host, and no pricing. Access runs
  through the Open Commerce Ecosystem partner programme and a sales demo request.
