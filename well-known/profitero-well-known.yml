note: >-
  Nothing was found. Every /.well-known/* path on www.profitero.com returns a hard
  HTTP 404 (the site runs on Webflow, which 404s correctly rather than soft-404ing —
  /terms, /pricing and /security all return 404 as well, so a 404 here is a real
  absence and a 200 would be a real document).
  Two hosts produce misleading responses and are recorded as MISSES, not hits:
  app.profitero.com answers HTTP 301 to /login.html for most paths (and HTTP 500 for
  the rest) because the whole application is gated; sso.profitero.com is a
  single-page-app catch-all that answers HTTP 200 with the SAME ~450-byte HTML shell
  (<title>Authentication</title>, <div id="root">) for EVERY path, including
  /openapi.json and /.well-known/agent-card.json. Those 200s are the classic SPA
  catch-all false positive and carry no document.
  No WellKnown, SecurityTxt, APICatalog or AgentCard pointer is emitted in apis.yml
  as a result — a recorded absence is data, but it is not a presence.
